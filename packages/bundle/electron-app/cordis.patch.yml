# The dsh-electron-app bundle patch: the desktop surface over the dsh-base
# layer. Applied after dsh-base's insert; rows here override base rows by id,
# with the profile's own cordis.patch.yml and any --patch overlays still to
# come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# This surface has NO listening webServer: `connection` and `modules` mount
# bare (PR1 made both activate without one), and the Connection fetch handler
# plus client-modules bundle resources are carried over the electron-runtime
# row's IPC socket instead of HTTP. The electron-startup plugin injects
# `cmdlineArgs` and provides `electronStartup`; electron-runtime reads it.
# `dsh --profile electron --help` provides neither service, so no IPC socket
# opens and no window spawns.

# ── surface-specific values the base deliberately omits ─────────────────────

# Desktop chat uses the local GeoCRM BYOK gateway. `llm-deepseek` stays in the
# base layer for `dsh web` / headless; this overlay hides that card and points
# the default agent model at the `geocrm` route. Web search's DeepSeek route
# is disabled with it — fetch stays on `http`.
- id: llm-deepseek
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: agent-default-model
  config:
    provider: geocrm
    model: deepseek:deepseek-v4-flash

- id: web
  config:
    fetchProvider: http

- insert:
    - id: llm-geocrm
      name: '@deepseek-ai/dsh-llm-geocrm'

    # Host-plane CRM tools: every desktop session inherits them. GeoCRM
    # enforces desktop_agent and write grants on each POST.
    - id: tool-geocrm
      name: '@deepseek-ai/dsh-tool-geocrm'

- id: system-prompt
  config:
    persona: >-
      You are the GeoCRM Harness work agent powered by the {{model}} model. Your working directory is {{cwd}}. You still write and edit software when that is the job.

# Full-text session search is opt-in (the base row's `openAt: never`). This
# restatement keeps the desktop values on one ephemeral in-memory index; a
# deployment enabling content search overrides `openAt` to `first-search` in a
# later patch layer, which defers the node:sqlite import and in-memory handle
# to the first search so Node 22 startup stays quiet.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    # TEMPORARY workaround: DSH_TOOLS_MODE (native|ptc|both) opts a whole dsh
    # process into PTC mode while per-session tool-presentation selection is being
    # designed; unset keeps the schema default (native). Remove the env seam
    # once the desktop UI owns the choice per session.
    mode: !!js process.env.DSH_TOOLS_MODE

# ── desktop-only host rows and the browser roster ───────────────────────────

# `dsh.client` rows are the same browser roster the Web surface mounts; the
# client packages are transport-agnostic (they select their carrier through
# `window.__DSH_TRANSPORT__`, installed by the Electron preload script, not
# by composition here).
- insert:
    # Host-owned opt-in sampled when a new desktop session receives its preset
    # delegation tools. The Plugins page edits this settings namespace.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    # Browser Session export: `/export` command plus the shared download dialog.
    - id: session-log-download
      name: '@deepseek-ai/dsh-session-log-export'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    # Whole-log turn/step counts for the chat stats strip (the sessionStats
    # projection key); the projection registry itself is a base-layer row.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # Whole-log turn outline for the chat turn rail (the turnOutline
    # projection key): every turn stays navigable before its events page in.
    - id: session-turn-outline
      name: '@deepseek-ai/dsh-session-turn-outline'

    # The operator sits at this same machine's display, so the native
    # chooser is always viable; mount it directly rather than the auto/browse
    # adaptive chooser the remote-reachable Web surface needs.
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    # Read-only projection of current Loader entries for trusted client RPCs.
    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    # Session commands, cold reads, and live control over Typert Remote.
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    # Configuration-surface reads and writes over Typert Remote. Each method
    # reports an actionable error when its settings-domain provider is absent.
    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    # Workspace commands and reconnect-safe projection over Typert Remote.
    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # Ordinary provider for the parsed Electron flags (--no-window).
    - id: electron-startup
      name: '@deepseek-ai/dsh-electron-app/startup'

    # Desktop glue owned by this bundle: starts the IPC listener over
    # ctx.connection/ctx.clientModules with no listening webServer, registers
    # the desktop-surface prompt section, and — unless electronStartup says
    # otherwise — spawns the built Electron shell pointed at the resolved
    # frontend dist and the IPC endpoint.
    - id: electron-runtime
      name: '@deepseek-ai/dsh-electron-app'
      inject: [electronStartup]
      config:
        openWindow: !!js ctx.electronStartup.openWindow

    # Dual-face: the node half composes window.__DSH_BOOT__ and answers
    # /plugins/<id>/client.js through electron-runtime's IPC socket (no HTTP
    # route registers with no webServer present); the browser half is the
    # module table the shell kernel constructs before cordis exists.
    - id: modules
      name: '@deepseek-ai/dsh-client-modules'

    # Owns both ends of the desktop transport: node half answers /api
    # through electron-runtime's IPC socket (createSharedFetchHandler needs
    # no listening webServer); browser half is installed by the Electron
    # preload script as window.__DSH_TRANSPORT__.
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'

    # Raw Blob and ReadableStream uploads run independently of Connection's
    # RPC and generation service. session-controller injects fileUploads.
    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    - id: cordis-client-runner
      name: '@deepseek-ai/dsh-cordis-client-runner'

    - id: ui-theme
      name: '@deepseek-ai/dsh-client-ui-theme'

    - id: locale
      name: '@deepseek-ai/dsh-client-locale'

    - id: ui-layout
      name: '@deepseek-ai/dsh-client-ui-layout'

    - id: ui-renderer
      name: '@deepseek-ai/dsh-client-ui-renderer'

    - id: ui-session
      name: '@deepseek-ai/dsh-client-ui-session'

    - id: ui-sidebar
      name: '@deepseek-ai/dsh-client-ui-sidebar'

    - id: ui-settings
      name: '@deepseek-ai/dsh-client-ui-settings'

    - id: ui-settings-general
      name: '@deepseek-ai/dsh-client-ui-settings-general'

    # Occupies `shell.gate` in the Electron renderer (`dsh-app:`). Web leaves
    # that seat empty. Sign-in protocol stays in this package, not the bundle.
    - id: ui-settings-models
      name: '@deepseek-ai/dsh-client-ui-settings-models'

    - id: ui-settings-plugin-inventory
      name: '@deepseek-ai/dsh-client-ui-settings-plugin-inventory'

    - id: ui-conversation
      name: '@deepseek-ai/dsh-client-ui-conversation'

    - id: ui-approval
      name: '@deepseek-ai/dsh-client-ui-approval'

    - id: ui-chat
      name: '@deepseek-ai/dsh-client-ui-chat'

    # Official occupants for the generic sidebar and conversation brand slots.
    - id: ui-brand-official
      name: '@deepseek-ai/dsh-client-ui-brand-official'

    - id: ui-attachment
      name: '@deepseek-ai/dsh-client-ui-attachment'

    # Tool call tree, generic fallback, and keyed business Tool views.
    - id: ui-tool
      name: '@deepseek-ai/dsh-client-ui-tool'

    - id: ui-cordis
      name: '@deepseek-ai/dsh-client-ui-cordis'

    # Durable workflow lifecycle as an independent Chat node after the
    # existing generic workflow tool row.
    - id: ui-workflow-run
      name: '@deepseek-ai/dsh-client-ui-workflow-run'

    # Turn tail: the produced-files row under each closing assistant message.
    # Remove this entry to turn the surface off; the tail hole renders empty.
    - id: ui-deliverables
      name: '@deepseek-ai/dsh-client-ui-deliverables'

    - id: ui-workspace
      name: '@deepseek-ai/dsh-client-ui-workspace'

    # The host `directory-picker` row above is native-only (this surface has
    # no `webServer`, so `directory-picker-auto` cannot mount). The native
    # Host package does not occupy ui-workspace's directory-flow hole; without
    # this client surface the Choose workspace chip opens an empty menu.
    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    # Input triggers: the '/' | '@' pipeline (ui-input-trigger), the command surface over
    # it (ui-commands), and the reference sources (ui-skill / ui-reference).
    - id: ui-input-trigger
      name: '@deepseek-ai/dsh-client-ui-input-trigger'

    - id: ui-commands
      name: '@deepseek-ai/dsh-client-ui-commands'

    - id: ui-skill
      name: '@deepseek-ai/dsh-client-ui-skill'

    - id: ui-subagent
      name: '@deepseek-ai/dsh-client-ui-subagent'

    - id: ui-reference
      name: '@deepseek-ai/dsh-client-ui-reference'

    # Read-only active Schedule catalog. The shipped desktop graph resolves
    # the client package but leaves it disabled; an explicit Schedule overlay
    # enables this same row together with the host Schedule services.
    - id: ui-schedule
      name: '@deepseek-ai/dsh-client-ui-schedule'
      disabled: true

    # Background jobs: the session-header list over the jobsBySession mirror.
    - id: ui-jobs
      name: '@deepseek-ai/dsh-client-ui-jobs'

    # Goal surface: GoalBar in the input dock over the goal session projection.
    - id: ui-goal
      name: '@deepseek-ai/dsh-client-ui-goal'

    # Per-message feedback: Like/Dislike plus an optional note in the
    # assistant-message action strip, over the messageFeedback Remote.
    - id: ui-message-feedback
      name: '@deepseek-ai/dsh-client-ui-message-feedback'

    # Model selection: the /model popupSelect + composer seat over session.models.
    - id: ui-model-selection
      name: '@deepseek-ai/dsh-client-ui-model-selection'

    - id: ui-permission
      name: '@deepseek-ai/dsh-client-ui-permission-presets'

    # The agent-preset row in General settings: the default preset for
    # sessions created later. Absent a roster it renders nothing.
    - id: ui-agent-preset
      name: '@deepseek-ai/dsh-client-ui-agent-preset'

    # Plugin configuration: the host-plane sections a user owns, as expandable
    # cards. A namespace this deployment does not expose renders nothing.
    - id: ui-settings-plugins
      name: '@deepseek-ai/dsh-client-ui-settings-plugins'

    # Plan control: the composer plan seat over the plan projection + /plan channel.
    - id: ui-plan
      name: '@deepseek-ai/dsh-client-ui-plan'

    - id: ui-user-questions
      name: '@deepseek-ai/dsh-client-ui-user-questions'

    - id: ui-trajectory
      name: '@deepseek-ai/dsh-client-ui-trajectory'

# ── the agent plane moves behind agent presets ─────────────────────────────
#
# Every row below composes what ONE agent contributes to the host registries:
# its tools, its prompt sections, its delegation backends. The base keeps them
# for the TUI, which is single-session and composes its agent process-wide; the
# desktop surface disables them here and lets each session mount a preset
# instead, matching the Web surface.
#
# Disabling rather than deleting is deliberate: the base is shared, and a row
# absent from a surface overlay would silently reappear the day someone reorders
# the composition.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

# The background-job REGISTRY stays on the host plane; only the model-facing
# `job_*` controls move. See the identical reasoning on the Web bundle patch.

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

# The `skill` REGISTRY stays in the host plane; only the per-agent rows move
# behind presets. See the identical reasoning on the Web bundle patch.

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

# The goal service and session driver stay on the host plane, where Gateway
# remotes resolve them. Presets own the human command and model-facing tool.

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

# The token METER stays on the host plane; only the compaction backend that
# reads it moves. See the identical reasoning on the Web bundle patch and
# `.agents/notes/implemented/architecture/2026-08-10-host-plane-ownership-after-presets.md`.

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

# The subagent registry and its backends STAY in the host plane. See the
# identical reasoning on the Web bundle patch.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

# The preset roster. Same shipped-default composition as the Web bundle patch.
- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard
